replicaCount: 3

image:
  repository: task-backend
  tag: "2.2"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

database:
  username: "taskuser"
  password: ""

ingress:
  enabled: true
  host: task-app-prod.local
